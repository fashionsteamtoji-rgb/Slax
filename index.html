<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة Slax الرسمية - النسخة المطورة</title>
    <!-- مكتبة الشطرنج الأصلية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #07090e; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }

        /* نافذة الترحيب */
        #welcome-popup {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white;
            padding: 12px 24px; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 2000; text-align: center; animation: fadeInOut 4s forwards; border: 1px solid rgba(255,255,255,0.2);
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -20px); }
            15% { opacity: 1; transform: translate(-50%, 0); }
            80% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); pointer-events: none; }
        }

        /* بانر الشعار */
        .hero-banner {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.85)), 
                        radial-gradient(circle at center, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            padding: 22px 15px; text-align: center;
        }
        .hero-title {
            font-size: 2.6rem; font-weight: 900; letter-spacing: 2px;
            background: linear-gradient(45deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }
        .hero-subtitle {
            font-size: 0.9rem; color: #94a3b8; font-weight: 600;
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.03);
            padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);
        }
        .hero-subtitle span { color: #38bdf8; font-weight: bold; }

        /* القائمة العلوية */
        header {
            background: rgba(22, 27, 34, 0.9); backdrop-filter: blur(12px);
            padding: 10px 15px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(59, 130, 246, 0.3); position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 1.1rem; font-weight: 900; color: #38bdf8; }
        nav { display: flex; gap: 5px; overflow-x: auto; }
        nav::-webkit-scrollbar { display: none; }
        nav button {
            background: rgba(33, 38, 45, 0.6); border: 1px solid rgba(255,255,255,0.05);
            color: #94a3b8; font-size: 0.76rem; cursor: pointer; font-weight: 600;
            padding: 6px 10px; border-radius: 8px; transition: all 0.3s ease; white-space: nowrap;
        }
        nav button:hover { background: rgba(56, 189, 248, 0.1); color: #38bdf8; }
        nav button.active {
            background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white;
            border-color: #38bdf8; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .section { display: none; padding: 15px; max-width: 750px; margin: 0 auto; width: 100%; flex: 1; }
        .section.active { display: flex; flex-direction: column; align-items: center; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* الرسم والزووم */
        .canvas-container {
            background-color: #161b22; border: 1px solid #30363d; border-radius: 14px;
            padding: 12px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .canvas-wrapper {
            width: 100%; height: 320px; overflow: auto; border: 2px solid #38bdf8;
            border-radius: 10px; background-color: #ffffff; display: flex; justify-content: center; align-items: center;
        }
        canvas { cursor: crosshair; touch-action: none; transform-origin: center center; }
        .tools-bar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }
        .tools-bar input[type="color"] { border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; background: none; }
        .tools-bar input[type="range"] { accent-color: #38bdf8; width: 65px; }
        
        .btn { background-color: #238636; color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.8rem; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-danger { background-color: #da3633; }
        .btn-secondary { background-color: #30363d; color: #c9d1d9; border: 1px solid rgba(255,255,255,0.05); }

        /* الدردشة */
        .chat-box { background-color: #161b22; border: 1px solid #30363d; border-radius: 14px; width: 100%; height: 360px; display: flex; flex-direction: column; overflow: hidden; }
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { background: #21262d; padding: 8px 12px; border-radius: 10px; max-width: 85%; font-size: 0.86rem; word-break: break-all; border: 1px solid rgba(255,255,255,0.03); }
        .chat-msg span { display: block; font-size: 0.7rem; color: #38bdf8; margin-bottom: 2px; font-weight: bold; }
        .chat-input-area { display: flex; padding: 10px; background: #0d1117; border-top: 1px solid #30363d; gap: 8px; }
        .chat-input-area input { flex: 1; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 8px; color: white; outline: none; font-size: 0.88rem; }

        /* الألعاب */
        .games-grid { display: grid; grid-template-columns: 1fr; gap: 15px; width: 100%; }
        .game-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 15px; text-align: center; }
        .xo-board { display: grid; grid-template-columns: repeat(3, 65px); gap: 5px; justify-content: center; margin: 12px 0; }
        .xo-cell { width: 65px; height: 65px; background: #21262d; border: 1px solid #30363d; font-size: 1.8rem; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #38bdf8; border-radius: 8px; }

        .chess-board { display: grid; grid-template-columns: repeat(8, 36px); grid-template-rows: repeat(8, 36px); gap: 1px; justify-content: center; margin: 10px 0; background: #30363d; padding: 2px; border-radius: 8px; }
        .chess-square { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; cursor: pointer; }
        .light { background: #eeeed2; color: #000; }
        .dark { background: #769656; color: #fff; }
        .chess-square.selected { background: #baca44 !important; }

        /* المجتمع واللايكات والتعليقات بأسماء واضحة ودقيقة */
        .feed-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 14px; width: 100%; margin-bottom: 14px; }
        .feed-card h3 { color: #38bdf8; margin-bottom: 8px; font-size: 0.9rem; }
        .interaction-bar { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; border-top: 1px solid #21262d; padding-top: 8px; }
        .likes-info { font-size: 0.78rem; color: #94a3b8; font-weight: 500; }
        .comments-section { margin-top: 6px; }
        .comments-list { font-size: 0.8rem; color: #e2e8f0; margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px; max-height: 110px; overflow-y: auto; }
        .comment-item { background: #0d1117; padding: 5px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.03); }
        .comment-item b { color: #38bdf8; margin-left: 4px; }
        .comment-box { display: flex; gap: 6px; }
        .comment-box input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 6px 10px; color: white; font-size: 0.78rem; outline: none; }

        /* الإعدادات */
        .settings-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 18px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .settings-card label { font-size: 0.85rem; color: #94a3b8; font-weight: 600; }
        .settings-card input { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 9px; color: white; width: 100%; outline: none; font-size: 0.88rem; }
    </style>
</head>
<body>

    <div id="welcome-popup">
        <h2>نورتو منصة Slax 🚀</h2>
        <p>المبدع: محمد</p>
    </div>

    <div class="hero-banner">
        <h1 class="hero-title">SLAX</h1>
        <div class="hero-subtitle">✨ إبداع بلا حدود بواسطة: <span>المبدع محمد</span></div>
    </div>

    <header>
        <div class="logo">⚡ Hub</div>
        <nav>
            <button class="active" onclick="switchTab('draw', this)">🎨 الرسم والزووم</button>
            <button onclick="switchTab('chat', this)">💬 الدردشة</button>
            <button onclick="switchTab('games', this)">🎮 الألعاب</button>
            <button onclick="switchTab('feed', this)">🌍 المجتمع</button>
            <button onclick="switchTab('settings', this)">⚙️ الحساب</button>
        </nav>
    </header>

    <!-- 1. الرسم -->
    <div id="draw" class="section active">
        <div class="canvas-container">
            <h2 style="color: #38bdf8; font-size: 1rem;">لوحة الرسم الحرة والزووم</h2>
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="paintCanvas" width="400" height="400"></canvas>
            </div>
            <div class="tools-bar">
                <input type="color" id="colorPicker" value="#38bdf8">
                <input type="range" id="brushSize" min="1" max="30" value="4">
                <button class="btn btn-secondary" onclick="zoomCanvas(0.2)">🔍+</button>
                <button class="btn btn-secondary" onclick="zoomCanvas(-0.2)">🔍-</button>
                <button class="btn btn-secondary" id="undoBtn">↩ تراجع</button>
                <button class="btn btn-secondary" id="redoBtn">↪ إعادة</button>
                <button class="btn btn-danger" id="clearBtn">مسح</button>
                <button class="btn" id="publishBtn">🚀 نشر للمجتمع</button>
            </div>
        </div>
    </div>

    <!-- 2. الدردشة -->
    <div id="chat" class="section">
        <h2 style="margin-bottom: 10px; color: #38bdf8; font-size: 1rem;">الدردشة الجماعية الحية</h2>
        <div class="chat-box">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="اكتب رسالتك..." onkeypress="checkChatEnter(event)">
                <button class="btn" onclick="sendChatMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <!-- 3. الألعاب -->
    <div id="games" class="section">
        <h2 style="margin-bottom: 10px; color: #38bdf8; font-size: 1rem;">التحدي والألعاب الحية</h2>
        <div class="games-grid">
            <div class="game-card">
                <h3>لعبة إكس أو (X-O)</h3>
                <div class="xo-board" id="xoBoard"></div>
                <p id="xoStatus" style="font-size: 0.82rem; color: #38bdf8; font-weight: bold;"></p>
                <button class="btn btn-secondary" style="margin-top: 8px;" onclick="resetMultiplayerXO()">تصفير الطاولة</button>
            </div>

            <div class="game-card">
                <h3>طاولة الشطرنج</h3>
                <div id="chessContainer" style="display: flex; justify-content: center;"></div>
                <p id="chessStatus" style="font-size: 0.82rem; color: #38bdf8; margin-top: 5px; font-weight: bold;"></p>
                <button class="btn btn-secondary" style="margin-top: 8px;" onclick="resetChessGame()">إعادة ضبط الشطرنج</button>
            </div>
        </div>
    </div>

    <!-- 4. المجتمع -->
    <div id="feed" class="section">
        <h2 style="margin-bottom: 10px; color: #38bdf8; font-size: 1rem;">منشورات المجتمع واللايكات</h2>
        <div id="postsContainer" style="width: 100%;"></div>
    </div>

    <!-- 5. الإعدادات -->
    <div id="settings" class="section">
        <div class="settings-card">
            <h2 style="color: #38bdf8; font-size: 1.05rem;">إعدادات الحساب</h2>
            <div>
                <label>اسمك (يظهر بالتعليقات واللايكات والدردشة):</label>
                <input type="text" id="usernameInput" placeholder="ادخل اسمك...">
            </div>
            <button class="btn" onclick="saveSettings()">💾 حفظ الاسم</button>
        </div>
    </div>

    <script>
        function switchTab(tabId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function getUserName() {
            return localStorage.getItem('slax_username') || 'زائر Slax';
        }

        window.onload = () => {
            let savedName = localStorage.getItem('slax_username');
            if(!savedName) {
                savedName = 'مستخدم ' + Math.floor(Math.random() * 900 + 100);
                localStorage.setItem('slax_username', savedName);
            }
            document.getElementById('usernameInput').value = savedName;

            ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveState();
            loadChat();
            loadPosts();
            initMultiplayerXO();
            renderChessBoard();
        };

        function saveSettings() {
            let newName = document.getElementById('usernameInput').value.trim();
            if(newName) {
                localStorage.setItem('slax_username', newName);
                alert('تم حفظ اسمك بنجاح! ✨');
                loadPosts();
                loadChat();
            }
        }

        // الرسم وزووم
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false, currentZoom = 1;
        let history = [], historyStep = -1;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';

        function saveState() {
            historyStep++;
            if (historyStep < history.length) { history.length = historyStep; }
            history.push(canvas.toDataURL('image/png', 0.5));
        }

        function startDraw(e) { isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); }
        function draw(e) {
            if (!isDrawing) return;
            const p = getPos(e);
            ctx.strokeStyle = document.getElementById('colorPicker').value;
            ctx.lineWidth = document.getElementById('brushSize').value;
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
        }
        function stopDraw() { if (isDrawing) { isDrawing = false; saveState(); } }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            let cx = e.clientX, cy = e.clientY;
            if (e.touches && e.touches[0]) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
            return { x: (cx - rect.left) / currentZoom, y: (cy - rect.top) / currentZoom };
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('touchstart', (e) => { startDraw(e); e.preventDefault(); });
        canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); });
        canvas.addEventListener('touchend', (e) => { stopDraw(); e.preventDefault(); });

        function zoomCanvas(amount) {
            currentZoom = Math.max(0.5, Math.min(2.5, currentZoom + amount));
            canvas.style.transform = `scale(${currentZoom})`;
        }

        document.getElementById('undoBtn').addEventListener('click', () => {
            if (historyStep > 0) {
                historyStep--; let img = new Image();
                img.src = history[historyStep];
                img.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); }
            }
        });
        document.getElementById('redoBtn').addEventListener('click', () => {
            if (historyStep < history.length - 1) {
                historyStep++; let img = new Image();
                img.src = history[historyStep];
                img.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); }
            }
        });
        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height); saveState();
        });

        // النشر واللايكات والتعليقات بدقة تامة
        document.getElementById('publishBtn').addEventListener('click', () => {
            try {
                let posts = JSON.parse(localStorage.getItem('slax_posts') || '[]');
                posts.unshift({
                    id: Date.now(),
                    author: getUserName(),
                    image: canvas.toDataURL('image/jpeg', 0.6),
                    likes: [],
                    comments: []
                });
                localStorage.setItem('slax_posts', JSON.stringify(posts));
                loadPosts();
                switchTab('feed', document.querySelectorAll('nav button')[3]);
                alert('تم نشر رسمتك في المجتمع بنجاح! 🚀');
            } catch(e) {
                alert('حدث خطأ أثناء النشر، حاول مسح بعض الرسومات القديمة.');
            }
        });

        function loadPosts() {
            let container = document.getElementById('postsContainer');
            let posts = JSON.parse(localStorage.getItem('slax_posts') || '[]');
            let currentName = getUserName();

            if(posts.length === 0) {
                container.innerHTML = '<p style="color: #94a3b8; text-align: center; font-size: 0.82rem; margin-top: 20px;">لا توجد منشورات حالياً. انشر رسمتك الأولى! 🎨</p>';
                return;
            }

            container.innerHTML = posts.map((p, idx) => {
                let likesList = p.likes || [];
                let hasLiked = likesList.includes(currentName);
                let likesText = likesList.length > 0 ? `أعجب بها: ${likesList.join(', ')}` : 'كن أول المعجبين بهذا المنشور';
                let commentsList = p.comments || [];

                return `
                <div class="feed-card">
                    <h3>🎨 رسمة بواسطة: ${p.author}</h3>
                    <img src="${p.image}" style="width:100%; border-radius:8px; margin-top:6px; border:1px solid #30363d;">
                    
                    <div class="interaction-bar">
                        <button class="btn ${hasLiked ? 'btn-secondary' : ''}" style="padding: 4px 10px; font-size: 0.78rem; width: fit-content;" onclick="toggleLike(${p.id})">
                            ❤️ أعجبني (${likesList.length})
                        </button>
                        <div class="likes-info">👤 ${likesText}</div>
                    </div>

                    <div class="comments-section">
                        <div class="comments-list">
                            ${commentsList.map(c => `<div class="comment-item"><b>${c.user}:</b> ${c.text}</div>`).join('')}
                        </div>
                        <div class="comment-box">
                            <input type="text" id="commInput_${p.id}" placeholder="اكتب تعليقاً..." onkeypress="checkCommentEnter(event, ${p.id})">
                            <button class="btn" style="padding: 4px 8px; font-size:0.75rem;" onclick="addComment(${p.id})">تعليق</button>
                        </div>
                    </div>
                </div>
            `;}).join('');
        }

        function toggleLike(postId) {
            let posts = JSON.parse(localStorage.getItem('slax_posts') || '[]');
            let p = posts.find(item => item.id === postId);
            if(!p) return;
            if(!p.likes) p.likes = [];

            let name = getUserName();
            let index = p.likes.indexOf(name);
            if(index > -1) {
                p.likes.splice(index, 1);
            } else {
                p.likes.push(name);
            }
            localStorage.setItem('slax_posts', JSON.stringify(posts));
            loadPosts();
        }

        function addComment(postId) {
            let input = document.getElementById(`commInput_${postId}`);
            let text = input.value.trim();
            if(!text) return;
            
            let posts = JSON.parse(localStorage.getItem('slax_posts') || '[]');
            let p = posts.find(item => item.id === postId);
            if(!p) return;
            if(!p.comments) p.comments = [];

            p.comments.push({ user: getUserName(), text: text });
            localStorage.setItem('slax_posts', JSON.stringify(posts));
            loadPosts();
        }
        function checkCommentEnter(e, postId) { if(e.key === 'Enter') addComment(postId); }

        // الدردشة
        function sendChatMessage() {
            let input = document.getElementById('chatInput');
            let text = input.value.trim();
            if(!text) return;
            let messages = JSON.parse(localStorage.getItem('slax_chat') || '[]');
            messages.push({ user: getUserName(), text: text });
            localStorage.setItem('slax_chat', JSON.stringify(messages));
            input.value = '';
            loadChat();
        }
        function checkChatEnter(e) { if(e.key === 'Enter') sendChatMessage(); }

        function loadChat() {
            let box = document.getElementById('chatMessages');
            let messages = JSON.parse(localStorage.getItem('slax_chat') || '[]');
            box.innerHTML = messages.map(m => `<div class="chat-msg"><span>👤 ${m.user}</span>${m.text}</div>`).join('');
            box.scrollTop = box.scrollHeight;
        }

        // X-O جماعي
        function getXOState() {
            return JSON.parse(localStorage.getItem('slax_xo') || JSON.stringify({ board: Array(9).fill(''), turn: 'X', active: true }));
        }

        function initMultiplayerXO() {
            let state = getXOState();
            let boardEl = document.getElementById('xoBoard');
            boardEl.innerHTML = state.board.map((val, i) => `<div class="xo-cell" onclick="makeMultiplayerXOMove(${i})">${val}</div>`).join('');
            document.getElementById('xoStatus').textContent = state.active ? `دور اللاعب: ${state.turn}` : 'انتهت الجولة!';
        }

        function makeMultiplayerXOMove(i) {
            let state = getXOState();
            if(!state.active || state.board[i] !== '') return;
            state.board[i] = state.turn;
            
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            let won = false;
            for(let w of wins) {
                let [a,b,c] = w;
                if(state.board[a] && state.board[a] === state.board[b] && state.board[a] === state.board[c]) {
                    state.active = false;
                    document.getElementById('xoStatus').textContent = `الفائز: ${state.board[a]} 🎉`;
                    won = true;
                }
            }
            if(!state.board.includes('') && !won) {
                state.active = false;
                document.getElementById('xoStatus').textContent = `تعادل! 🤝`;
            }

            if(state.active) {
                state.turn = state.turn === 'X' ? 'O' : 'X';
            }
            localStorage.setItem('slax_xo', JSON.stringify(state));
            initMultiplayerXO();
        }

        function resetMultiplayerXO() {
            let state = { board: Array(9).fill(''), turn: 'X', active: true };
            localStorage.setItem('slax_xo', JSON.stringify(state));
            initMultiplayerXO();
        }

        // شطرنج جماعي مستقر
        let chess = new Chess();
        let selectedSquare = null;

        function renderChessBoard() {
            let savedFen = localStorage.getItem('slax_chess_fen');
            if (savedFen) { chess.load(savedFen); }

            let container = document.getElementById('chessContainer');
            container.innerHTML = `<div class="chess-board" id="chessGrid"></div>`;
            let grid = document.getElementById('chessGrid');

            let board = chess.board();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    let squareEl = document.createElement('div');
                    let isLight = (r + c) % 2 === 0;
                    let squareName = String.fromCharCode(97 + c) + (8 - r);
                    
                    squareEl.className = `chess-square ${isLight ? 'light' : 'dark'}`;
                    if (selectedSquare === squareName) { squareEl.classList.add('selected'); }

                    let piece = board[r][c];
                    if (piece) {
                        const symbols = {p:'♟', r:'♜', n:'♞', b:'♝', q:'♛', k:'♚', P:'♙', R:'♖', N:'♘', B:'♗', Q:'♕', K:'♔'};
                        squareEl.textContent = symbols[piece.color === 'w' ? piece.type.toUpperCase() : piece.type];
                    }

                    squareEl.onclick = () => handleChessSquareClick(squareName);
                    grid.appendChild(squareEl);
                }
            }

            let statusText = `الدور الحالي: ${chess.turn() === 'w' ? 'الأبيض ⚪' : 'الأسود ⚫'}`;
            if (chess.in_checkmate()) statusText = 'كش مات! انتهت اللعبة 🏆';
            else if (chess.in_draw()) statusText = 'تعادل! 🤝';
            document.getElementById('chessStatus').textContent = statusText;
        }

        function handleChessSquareClick(square) {
            let savedFen = localStorage.getItem('slax_chess_fen');
            if (savedFen) chess.load(savedFen);

            if (!selectedSquare) {
                let piece = chess.get(square);
                if (piece && piece.color === chess.turn()) {
                    selectedSquare = square;
                    renderChessBoard();
                }
            } else {
                let move = chess.move({ from: selectedSquare, to: square, promotion: 'q' });
                selectedSquare = null;
                if (move) { localStorage.setItem('slax_chess_fen', chess.fen()); }
                renderChessBoard();
            }
        }

        function resetChessGame() {
            chess.reset();
            localStorage.setItem('slax_chess_fen', chess.fen());
            selectedSquare = null;
            renderChessBoard();
        }

        // المزامنة التلقائية بالخلفية كل 3 ثوانٍ
        setInterval(() => {
            loadChat();
            loadPosts();
            initMultiplayerXO();
            renderChessBoard();
        }, 3000);
    </script>
</body>
</html>
