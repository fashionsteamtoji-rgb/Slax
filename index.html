<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale5.0">
    <title>Slax - الموقع الشخصي</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* نافذة الترحيب المؤقتة */
        #welcome-popup {
            position: fixed;
            top: 20px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 1000;
            animation: fadeInOut 5s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); pointer-events: none; }
        }

        h1 {
            margin-bottom: 10px;
            font-size: 1.8rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        p {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        /* لوحة الرسم */
        canvas {
            border: 2px solid #38bdf8;
            border-radius: 12px;
            background-color: #1e293b;
            cursor: crosshair;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            touch-action: none; /* يمنع تحريك الشاشة بالجوال أثناء الرسم */
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <!-- رسالة الترحيب التي تختفي بعد 5 ثواني -->
    <div id="welcome-popup">أهلاً بك في موقع Slax الرسمي! نورتنا 🚀</div>

    <h1>لوحة الرسم التفاعلية</h1>
    <p>ارسم بإصبعك أو بالماوس بحرية تامة:</p>

    <canvas id="drawCanvas" width="350" height="400"></canvas>

    <div class="controls">
        <button id="clearBtn">مسح اللوحة</button>
    </div>

    <script>
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');

        let isDrawing = false;

        // إعدادات الخط
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // دالة تبدأ الرسم (للماوس أو اللمس)
        function startPosition(e) {
            isDrawing = true;
            draw(e);
        }

        function endPosition() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!isDrawing) return;

            // استخراج إحداثيات الماوس أو اللمس بدقة
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches[0]) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            const x = clientX - rect.left;
            const y = clientY - rect.top;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // ربط الأحداث للكمبيوتر (موس)
        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        // ربط الأحداث للموبايل (لمس)
        canvas.addEventListener('touchstart', (e) => { startPosition(e); e.preventDefault(); });
        canvas.addEventListener('touchend', (e) => { endPosition(); e.preventDefault(); });
        canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); });

        // زر المسح
        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });
    </script>

</body>
</html>
